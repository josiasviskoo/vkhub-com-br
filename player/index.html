<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Player de Vídeos</title>
<style>
  :root {
    --text: #ffffff;
    --muted: rgba(255,255,255,.75);
    --accent: #f5b301;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(circle at 20% 15%, #3a2a6b 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, #0f4c5c 0%, transparent 50%),
      linear-gradient(160deg, #141428 0%, #0b0d17 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 48px 16px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #status {
    max-width: 960px;
    margin: 0 auto 24px;
    color: var(--muted);
    font-size: .9rem;
    text-align: center;
  }
  #status:empty { display: none; }
  #grid {
    max-width: 960px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 28px 12px;
    justify-items: center;
  }
  .folder {
    width: 96px;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    color: inherit;
    font: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .folder .icon {
    width: 76px;
    height: 76px;
    border-radius: 20px;
    background: linear-gradient(160deg, rgba(255,255,255,.22), rgba(255,255,255,.08));
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 8px 20px rgba(0,0,0,.35);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: grid;
    place-items: center;
    position: relative;
    transition: transform .15s ease;
  }
  /* Selo de "já guardado no navegador" no canto da pasta */
  .folder .salvo {
    position: absolute;
    right: -6px; bottom: -6px;
    width: 28px; height: 28px;
    display: none;
    place-items: center;
    background: rgba(20,20,40,.85);
    color: var(--muted);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  .folder .salvo svg { width: 16px; height: 16px; }
  .folder.cache-parcial .salvo, .folder.cache-total .salvo { display: grid; }
  .folder.cache-total .salvo { color: #4ade80; border-color: rgba(74,222,128,.45); }
  /* Pasta com vídeo sendo baixado agora pelo "baixar tudo" */
  .folder.baixando .salvo { display: grid; animation: pulsar 1.2s ease-in-out infinite; }
  @keyframes pulsar { 50% { opacity: .35; } }
  .folder svg { width: 52px; height: 52px; display: block; }
  .folder:hover .icon { transform: scale(1.06); }
  .folder:active .icon { transform: scale(.92); }
  .folder:focus-visible { outline: none; }
  .folder:focus-visible .icon { outline: 2px solid var(--accent); outline-offset: 3px; }
  /* Desktop: ícones grandes */
  @media (min-width: 900px) {
    body { padding: 64px 32px; }
    #status, #grid { max-width: 1400px; }
    #grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 48px 24px; }
    .folder { width: 180px; gap: 14px; }
    .folder .icon { width: 150px; height: 150px; border-radius: 36px; }
    .folder svg { width: 104px; height: 104px; }
    .folder .name { font-size: 1.05rem; }
    .folder .salvo { width: 44px; height: 44px; right: -10px; bottom: -10px; }
    .folder .salvo svg { width: 24px; height: 24px; }
  }
  .folder .name {
    width: 100%;
    font-size: .82rem;
    font-weight: 500;
    line-height: 1.25;
    text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    word-break: break-word;
  }

  #stage {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    z-index: 10;
  }
  #stage.on { display: block; }
  #video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .hud-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 72px;
    height: 72px;
    display: grid;
    place-items: center;
    background: rgba(0,0,0,.35);
    color: #fff;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    opacity: .3;
    transition: opacity .3s, background .2s;
    pointer-events: auto;
  }
  #home { left: 16px; }
  #next { right: 16px; }
  .hud-btn svg { width: 34px; height: 34px; display: block; }
  .hud-btn:active { transform: translateY(-50%) scale(.92); }
  @media (min-width: 900px) {
    .hud-btn { width: 104px; height: 104px; }
    #home { left: 32px; }
    #next { right: 32px; }
    .hud-btn svg { width: 48px; height: 48px; }
  }
  #stage.show-hud .hud-btn { opacity: .75; }
  .hud-btn:hover, .hud-btn:focus-visible { opacity: 1 !important; background: rgba(0,0,0,.6); outline: none; }
  #now {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    max-width: calc(100% - 32px);
    background: rgba(0,0,0,.45);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: .85rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .3s;
  }
  #stage.show-hud #now { opacity: 1; }
  /* "Disponível off-line": ícone pequeno e apagado no canto enquanto o vídeo toca */
  #offline {
    position: absolute;
    top: 16px; right: 16px;
    width: 18px; height: 18px;
    color: #4ade80;
    opacity: .4;
    transition: opacity .3s;
    pointer-events: none;
  }
  #offline svg { width: 100%; height: 100%; display: block; }
  #offline[hidden] { display: none; }
  #stage.show-hud #offline { opacity: .85; }

  #acoes {
    position: fixed;
    top: 14px; right: 14px;
    display: flex;
    gap: 8px;
  }
  body.locked #acoes { display: none; }
  .acao {
    position: relative;
    width: 40px; height: 40px;
    display: grid;
    place-items: center;
    background: rgba(255,255,255,.08);
    color: var(--muted);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 50%;
    cursor: pointer;
    transition: background .2s, color .2s, transform .15s;
  }
  .acao svg { width: 18px; height: 18px; display: block; }
  .acao:hover, .acao:focus-visible { background: rgba(255,255,255,.18); color: var(--text); outline: none; }
  .acao:active { transform: scale(.9); }
  .acao[hidden] { display: none; }
  /* Botão "baixar tudo": seta; parado com anel de progresso enquanto baixa; verde quando tudo off-line */
  #baixar .anel {
    position: absolute;
    inset: -1px;
    width: 40px; height: 40px;
    transform: rotate(-90deg);
    display: none;
  }
  #baixar .anel circle { fill: none; stroke: #4ade80; stroke-width: 2.5; stroke-dasharray: var(--p, 0) 100; transition: stroke-dasharray .3s; }
  #baixar .parar { display: none; }
  #baixar.ativo .anel, #baixar.ativo .parar { display: block; }
  #baixar.ativo .seta, #baixar.completo .seta { display: none; }
  #baixar .ok { display: none; }
  #baixar.completo:not(.ativo) .ok { display: block; }
  #baixar.completo { color: #4ade80; }

  #lock {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    z-index: 20;
  }
  body.locked #lock { display: grid; }
  body.locked #status, body.locked #grid { display: none; }
  #pin { display: flex; gap: 12px; }
  #pin.erro { animation: tremer .35s; }
  #pin input {
    width: 56px;
    height: 64px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.1);
    color: var(--text);
    font: 600 1.6rem system-ui, sans-serif;
    text-align: center;
    -webkit-text-security: disc;
    caret-color: transparent;
    outline: none;
  }
  #pin input:focus { border-color: var(--accent); }
  @keyframes tremer {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    50% { transform: translateX(10px); }
    75% { transform: translateX(-6px); }
  }
</style>
</head>
<body class="locked">

<div id="lock">
  <div id="pin">
    <input type="text" inputmode="numeric" autocomplete="off" aria-label="Dígito 1">
    <input type="text" inputmode="numeric" autocomplete="off" aria-label="Dígito 2">
    <input type="text" inputmode="numeric" autocomplete="off" aria-label="Dígito 3">
    <input type="text" inputmode="numeric" autocomplete="off" aria-label="Dígito 4">
  </div>
</div>

<div id="acoes">
  <button id="baixar" class="acao" type="button" title="Baixar todos os vídeos para assistir off-line" aria-label="Baixar todos os vídeos para assistir off-line" hidden>
    <svg class="seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>
    <svg class="parar" viewBox="0 0 24 24" fill="currentColor"><rect x="7.5" y="7.5" width="9" height="9" rx="1.5"/></svg>
    <svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v7M9 11.5l3 3 3-3"/></svg>
    <svg class="anel" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5" pathLength="100"/></svg>
  </button>
  <button id="limpar" class="acao" type="button" title="Limpar vídeos guardados no navegador" aria-label="Limpar vídeos guardados no navegador" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>
  </button>
</div>

<div id="status">Carregando…</div>

<div id="grid"></div>


<div id="stage">
  <video id="video" playsinline></video>
  <div id="hud">
    <button id="home" class="hud-btn" type="button" title="Voltar às pastas (Esc)" aria-label="Voltar às pastas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
    </button>
    <div id="now"></div>
    <span id="offline" title="Disponível off-line" hidden></span>
    <button id="next" class="hud-btn" type="button" title="Próximo vídeo (→)" aria-label="Próximo vídeo">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5.5v13l9.5-6.5z"/><rect x="16.5" y="5" width="2.5" height="14" rx="1"/></svg>
    </button>
  </div>
</div>

<script>
(function () {
  var grid = document.getElementById('grid');
  var statusEl = document.getElementById('status');
  var stage = document.getElementById('stage');
  var video = document.getElementById('video');
  var nowEl = document.getElementById('now');
  var homeBtn = document.getElementById('home');
  var nextBtn = document.getElementById('next');
  var offlineEl = document.getElementById('offline');

  var pastas = {};   // nome da pasta -> [arquivos de vídeo], vindo do lista.js
  var pastaAtual = null;
  var playlist = [];
  var current = 0;
  var hudTimer = null;
  var ultimaLista = null;

  // ---------- Pastas ----------
  var FOLDER_SVG =
    '<svg viewBox="0 0 64 64" aria-hidden="true">' +
    '<path d="M6 14a4 4 0 0 1 4-4h14l6 6h24a4 4 0 0 1 4 4v30a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z" fill="#f5b301"/>' +
    '<path d="M6 22h52v28a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z" fill="#ffc933"/>' +
    '<path d="M27 30v16l13-8z" fill="#111"/>' +
    '</svg>';
  // Ícone de "disponível off-line": já baixado, roda sem internet
  var SALVO_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v7M9 11.5l3 3 3-3"/></svg>';

  function renderFolders() {
    var names = Object.keys(pastas);
    grid.innerHTML = '';
    names.forEach(function (name) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'folder';
      btn.title = name + ' (' + pastas[name].length + (pastas[name].length === 1 ? ' vídeo)' : ' vídeos)');
      btn.innerHTML = '<span class="icon">' + FOLDER_SVG + '<span class="salvo">' + SALVO_SVG + '</span></span><span class="name"></span>';
      btn.querySelector('.name').textContent = name;
      btn.dataset.pasta = name;
      btn.addEventListener('click', function () { openFolder(name); });
      grid.appendChild(btn);
    });
    atualizarCache();
    if (location.protocol === 'file:') return; // mantém o aviso de lista desatualizada
    statusEl.textContent = names.length ? '' : 'Nenhuma pasta encontrada.';
  }

  function montarPlaylist(name) {
    return (pastas[name] || []).map(function (f) {
      return { name: f, url: encodeURIComponent(name) + '/' + encodeURIComponent(f) };
    });
  }

  // Sem internet, a fila fica só com os vídeos disponíveis off-line
  function tocaveis(lista) {
    if (navigator.onLine || !cacheOk) return lista;
    return lista.filter(function (v) { return videoSalvo(v.url); });
  }

  function openFolder(name) {
    // A tela cheia precisa ser pedida dentro do clique do usuário, antes de qualquer espera
    stage.classList.add('on');
    var fs = stage.requestFullscreen || stage.webkitRequestFullscreen;
    if (fs) { try { var p = fs.call(stage); if (p && p.catch) p.catch(function () {}); } catch (e) {} }

    // Relê a pasta na hora do clique, para pegar vídeos recém-adicionados
    carregarLista(function () {
      playlist = tocaveis(montarPlaylist(name));
      if (!playlist.length) {
        closePlayer();
        statusEl.textContent = montarPlaylist(name).length
          ? 'Sem internet, e nenhum vídeo da pasta "' + name + '" está disponível off-line.'
          : 'A pasta "' + name + '" não tem vídeos.';
        return;
      }
      statusEl.textContent = '';
      pastaAtual = name;
      current = 0;
      playCurrent();
    });
  }

  // ---------- Player ----------
  function playCurrent() {
    var item = playlist[current];
    mostrarNow();
    flashHud();
    if (video.getAttribute('src') === item.url) video.currentTime = 0;
    else video.src = item.url;
    video.volume = 1;
    var p = video.play();
    if (p && p.catch) {
      p.catch(function () {
        // Sem permissão de autoplay com som: tenta mudo
        video.muted = true;
        video.play().catch(function () {});
      });
    }
  }

  function mostrarNow() {
    var item = playlist[current];
    if (!item) return;
    offlineEl.innerHTML = SALVO_SVG;
    offlineEl.hidden = !videoSalvo(item.url);
    nowEl.textContent = (current + 1) + '/' + playlist.length + ' — ' + item.name;
  }

  // A cada troca de vídeo a pasta é relida: vídeos novos entram na fila e removidos saem
  function step(delta) {
    if (!pastaAtual) return;
    var atual = playlist[current] && playlist[current].name;
    carregarLista(function () {
      if (!stage.classList.contains('on')) return;
      var nova = tocaveis(montarPlaylist(pastaAtual));
      if (!nova.length) { closePlayer(); return; }
      var idx = -1;
      nova.forEach(function (v, k) { if (v.name === atual) idx = k; });
      if (idx === -1) {
        // O vídeo atual sumiu: segue a partir da mesma posição
        idx = Math.min(current, nova.length) - (delta > 0 ? 1 : 0);
      }
      playlist = nova;
      current = ((idx + delta) % nova.length + nova.length) % nova.length;
      playCurrent();
    });
  }

  // Volume sempre em 100%: se algo baixar o volume, volta na hora
  video.volume = 1;
  video.addEventListener('volumechange', function () {
    if (video.volume !== 1) video.volume = 1;
  });
  // Se o navegador obrigou a começar mudo (autoplay), libera o som no primeiro toque/tecla
  function liberarSom() { if (video.muted) { video.muted = false; video.volume = 1; } }
  document.addEventListener('click', liberarSom, true);
  document.addEventListener('keydown', liberarSom, true);

  video.addEventListener('ended', function () { step(1); });
  video.addEventListener('error', function () {
    if (!stage.classList.contains('on') || !playlist.length) return;
    // Pula vídeos que não puderam ser reproduzidos (se ainda houver outros)
    if (playlist.length > 1) setTimeout(function () { step(1); }, 500);
  });

  function closePlayer() {
    video.pause();
    video.removeAttribute('src');
    video.load();
    playlist = [];
    pastaAtual = null;
    stage.classList.remove('on', 'show-hud');
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (fsEl) {
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) { try { var p = exit.call(document); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
    }
  }

  function onFsChange() {
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (!fsEl && stage.classList.contains('on')) closePlayer();
  }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);

  function flashHud() {
    stage.classList.add('show-hud');
    clearTimeout(hudTimer);
    hudTimer = setTimeout(function () { stage.classList.remove('show-hud'); }, 2500);
  }
  stage.addEventListener('mousemove', flashHud);
  homeBtn.addEventListener('click', closePlayer);
  nextBtn.addEventListener('click', function () { step(1); });

  document.addEventListener('keydown', function (e) {
    if (!stage.classList.contains('on')) return;
    if (e.key === 'Escape') closePlayer();
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === ' ') {
      e.preventDefault();
      if (video.paused) video.play(); else video.pause();
    } else return;
    flashHud();
  });

  // ---------- Lista de pastas (lista.js) ----------
  // No servidor.py local ele é gerado na hora; no GitHub Pages é o lista.js publicado
  // (rode "python3 servidor.py --lista" antes de publicar para atualizá-lo)
  var local = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  function carregarLista(done) {
    var s = document.createElement('script');
    s.src = 'lista.js?t=' + Date.now();
    s.onload = function () {
      pastas = window.PLAYER_PASTAS || {};
      var json = JSON.stringify(pastas);
      if (json !== ultimaLista && !stage.classList.contains('on')) {
        ultimaLista = json;
        renderFolders();
      }
      s.remove();
      if (done) done();
    };
    s.onerror = function () {
      statusEl.textContent = local
        ? 'Lista de vídeos não encontrada. Rode "./iniciar.sh" dentro da pasta player.'
        : 'Não foi possível carregar a lista de vídeos.';
      s.remove();
      if (done) done();
    };
    document.head.appendChild(s);
  }

  // ---------- Senha de 4 dígitos ----------
  var SENHA = '0000';
  var pinEl = document.getElementById('pin');
  var digitos = Array.prototype.slice.call(pinEl.querySelectorAll('input'));

  function conferirSenha() {
    var valor = digitos.map(function (d) { return d.value; }).join('');
    if (valor.length < digitos.length) return;
    if (valor === SENHA) {
      document.body.classList.remove('locked');
      digitos.forEach(function (d) { d.blur(); });
      return;
    }
    pinEl.classList.remove('erro');
    void pinEl.offsetWidth; // reinicia a animação
    pinEl.classList.add('erro');
    digitos.forEach(function (d) { d.value = ''; });
    digitos[0].focus();
  }

  digitos.forEach(function (d, i) {
    d.addEventListener('input', function () {
      var nums = d.value.replace(/\D/g, '');
      // Aceita colar os 4 números de uma vez
      for (var k = 0; k < nums.length && i + k < digitos.length; k++) digitos[i + k].value = nums[k];
      if (!nums) { d.value = ''; return; }
      var prox = Math.min(i + nums.length, digitos.length - 1);
      digitos[prox].focus();
      conferirSenha();
    });
    d.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !d.value && i > 0) {
        digitos[i - 1].value = '';
        digitos[i - 1].focus();
        e.preventDefault();
      }
    });
    d.addEventListener('focus', function () { d.select(); });
  });
  digitos[0].focus();
  document.getElementById('lock').addEventListener('click', function () {
    var vazio = digitos.filter(function (d) { return !d.value; })[0];
    (vazio || digitos[digitos.length - 1]).focus();
  });

  // ---------- Tela sempre ativa (não deixa o computador entrar em descanso) ----------
  // O navegador solta o bloqueio quando a aba fica oculta, então ele é pedido de novo ao voltar
  var wakeLock = null;
  function manterTelaAtiva() {
    if (!('wakeLock' in navigator) || wakeLock || document.hidden) return;
    navigator.wakeLock.request('screen').then(function (lock) {
      wakeLock = lock;
      lock.addEventListener('release', function () { wakeLock = null; });
    }).catch(function () {});
  }
  manterTelaAtiva();
  document.addEventListener('visibilitychange', manterTelaAtiva);
  document.addEventListener('fullscreenchange', manterTelaAtiva);
  document.addEventListener('click', manterTelaAtiva);
  setInterval(manterTelaAtiva, 30000);

  // ---------- Cache dos vídeos (sw.js) ----------
  // O service worker guarda cada vídeo assistido; a seta baixa todos de uma vez para
  // assistir off-line; a lixeira apaga tudo com um clique.
  // Só funciona em http(s) — abrindo o index.html direto pelo arquivo, os botões ficam escondidos.
  var CACHE = 'player-videos-v2';
  var limparBtn = document.getElementById('limpar');
  var baixarBtn = document.getElementById('baixar');
  var cacheOk = 'serviceWorker' in navigator && window.caches && location.protocol !== 'file:';
  var guardados = {}; // caminho do vídeo (como o sw.js guarda) -> true
  var download = null; // { controle, total, feitos, falhas, pasta } enquanto o "baixar tudo" roda
  var retomar = false; // a internet caiu no meio do "baixar tudo": continua quando ela voltar

  function caminho(url) { return new URL(url, location.href).pathname; }
  function chave(url) { var u = new URL(url, location.href); return u.origin + u.pathname; }
  function videoSalvo(url) { return !!guardados[caminho(url)]; }

  function todosVideos() {
    var todos = [];
    Object.keys(pastas).forEach(function (nome) {
      montarPlaylist(nome).forEach(function (v) { v.pasta = nome; todos.push(v); });
    });
    return todos;
  }

  function tamanho(bytes) {
    if (bytes < 1e9) return Math.round(bytes / 1e6) + ' MB';
    return (bytes / 1e9).toFixed(1).replace('.', ',') + ' GB';
  }

  function aviso(msg, segundos) {
    statusEl.textContent = msg;
    if (segundos) setTimeout(function () { if (statusEl.textContent === msg) statusEl.textContent = ''; }, segundos * 1000);
  }

  // Lê o cache e marca as pastas (todos ou alguns vídeos guardados), o vídeo tocando agora e os botões
  function atualizarCache() {
    if (!cacheOk) return;
    caches.open(CACHE).then(function (cache) { return cache.keys(); }).then(function (reqs) {
      guardados = {};
      reqs.forEach(function (r) { guardados[caminho(r.url)] = true; });
      limparVelhos(reqs);
      Array.prototype.forEach.call(grid.querySelectorAll('.folder'), function (btn) {
        var lista = montarPlaylist(btn.dataset.pasta);
        var n = lista.filter(function (v) { return videoSalvo(v.url); }).length;
        btn.classList.toggle('cache-total', n > 0 && n === lista.length);
        btn.classList.toggle('cache-parcial', n > 0 && n < lista.length);
        btn.classList.toggle('baixando', !!download && download.pasta === btn.dataset.pasta);
        btn.querySelector('.salvo').title = n === lista.length
          ? 'Todos os vídeos disponíveis off-line'
          : n + ' de ' + lista.length + ' vídeos disponíveis off-line';
      });
      if (stage.classList.contains('on')) mostrarNow();
      var todos = todosVideos();
      var faltam = todos.filter(function (v) { return !videoSalvo(v.url); }).length;
      baixarBtn.classList.toggle('completo', todos.length > 0 && faltam === 0);
      if (!download) {
        baixarBtn.title = faltam
          ? 'Baixar ' + faltam + (faltam === 1 ? ' vídeo' : ' vídeos') + ' para assistir off-line'
          : 'Todos os vídeos disponíveis off-line';
      }
      if (navigator.storage && navigator.storage.estimate) {
        navigator.storage.estimate().then(function (est) {
          limparBtn.title = 'Limpar vídeos guardados no navegador (' + tamanho(est.usage || 0) + ')';
        }).catch(function () {});
      }
    }).catch(function () {});
  }

  // Vídeos que saíram das pastas não ocupam mais espaço no navegador
  function limparVelhos(reqs) {
    if (!Object.keys(pastas).length || download) return;
    var atuais = {};
    todosVideos().forEach(function (v) { atuais[caminho(v.url)] = true; });
    var velhos = reqs.filter(function (r) { return !atuais[caminho(r.url)]; });
    if (!velhos.length) return;
    caches.open(CACHE).then(function (cache) {
      return Promise.all(velhos.map(function (r) { return cache.delete(r); }));
    }).catch(function () {});
  }

  // Baixa um vídeo inteiro direto para o cache, avisando o progresso (0 a 1) enquanto chega
  function baixarVideo(v, sinal, progresso) {
    return fetch(v.url, { headers: { 'X-Player-Baixar': '1' }, cache: 'no-store', signal: sinal }).then(function (resp) {
      if (resp.status !== 200 || !resp.body) throw new Error('HTTP ' + resp.status);
      var total = Number(resp.headers.get('Content-Length')) || 0;
      var lidos = 0;
      var corpo = resp.body;
      if (total && window.TransformStream) {
        corpo = corpo.pipeThrough(new TransformStream({
          transform: function (bloco, c) { lidos += bloco.byteLength; progresso(lidos / total); c.enqueue(bloco); }
        }));
      }
      var headers = { 'Content-Type': resp.headers.get('Content-Type') || 'video/mp4' };
      if (total) headers['Content-Length'] = String(total);
      return caches.open(CACHE).then(function (cache) {
        return cache.put(chave(v.url), new Response(corpo, { headers: headers }));
      });
    });
  }

  function mostrarProgresso(fracao) {
    var p = (download.feitos + fracao) / download.total;
    baixarBtn.style.setProperty('--p', (p * 100).toFixed(1));
    var texto = 'Baixando para assistir off-line: ' + (download.feitos + 1) + ' de ' + download.total + ' — ' + Math.floor(p * 100) + '%';
    if (statusEl.textContent !== texto) statusEl.textContent = texto;
  }

  function baixarTudo() {
    var fila = todosVideos().filter(function (v) { return !videoSalvo(v.url); });
    if (!fila.length) { aviso('Todos os vídeos já estão disponíveis off-line.', 3); return; }
    if (!navigator.onLine) { aviso('Sem internet agora. Tente de novo quando a conexão voltar.', 4); return; }
    // Pede ao navegador para não apagar os vídeos sozinho quando faltar espaço
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
    retomar = false;
    download = { controle: new AbortController(), total: fila.length, feitos: 0, falhas: 0, pasta: null };
    baixarBtn.classList.add('ativo');
    baixarBtn.title = 'Parar o download';
    baixarBtn.setAttribute('aria-label', 'Parar o download');

    function proximo() {
      if (!download) return;
      var v = fila.shift();
      if (!v) { terminar(); return; }
      if (videoSalvo(v.url)) { download.feitos++; proximo(); return; } // o player guardou enquanto isso
      download.pasta = v.pasta;
      mostrarProgresso(0);
      atualizarCache();
      var meu = download;
      baixarVideo(v, meu.controle.signal, function (f) { if (download === meu) mostrarProgresso(f); }).then(function () {
        if (download !== meu) return;
        guardados[caminho(v.url)] = true;
        download.feitos++;
        proximo();
      }, function (err) {
        if (download !== meu) return;
        if (err && err.name === 'AbortError') return;
        if (err && err.name === 'QuotaExceededError') {
          terminar('Acabou o espaço do navegador para guardar vídeos. ' + download.feitos + ' baixados nesta vez.');
          return;
        }
        if (!navigator.onLine) {
          retomar = true;
          terminar('A internet caiu. O download continua sozinho quando a conexão voltar.');
          return;
        }
        download.falhas++;
        download.feitos++;
        proximo();
      });
    }

    function terminar(msg) {
      var d = download;
      download = null;
      baixarBtn.classList.remove('ativo');
      baixarBtn.style.removeProperty('--p');
      baixarBtn.setAttribute('aria-label', 'Baixar todos os vídeos para assistir off-line');
      atualizarCache();
      if (typeof msg === 'string') { if (msg) aviso(msg); }
      else if (d.falhas) aviso(d.falhas + (d.falhas === 1 ? ' vídeo não pôde' : ' vídeos não puderam') + ' ser baixados. Toque na seta para tentar de novo.');
      else aviso('Pronto: todos os vídeos estão disponíveis off-line.', 5);
    }
    download.terminar = terminar;
    proximo();
  }

  function pararDownload(msg) {
    if (!download) return;
    download.controle.abort();
    download.terminar(msg);
  }

  if (cacheOk) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
    baixarBtn.hidden = false;
    limparBtn.hidden = false;
    baixarBtn.addEventListener('click', function () {
      if (download) pararDownload('Download pausado. Toque na seta para continuar de onde parou.');
      else baixarTudo();
    });
    window.addEventListener('online', function () {
      if (retomar && !download) baixarTudo();
    });
    limparBtn.addEventListener('click', function () {
      retomar = false;
      pararDownload('');
      limparBtn.disabled = true;
      caches.delete(CACHE).then(function () {
        guardados = {};
        atualizarCache();
        aviso('Cache de vídeos limpo.', 3);
      }).catch(function () {
        aviso('Não foi possível limpar o cache.');
      }).then(function () { limparBtn.disabled = false; });
    });
  }

  if (location.protocol === 'file:') {
    statusEl.textContent = 'Aberto direto pelo arquivo: a lista pode estar desatualizada. Rode ./iniciar.sh e use http://localhost:8000';
  }
  carregarLista();
  // Na tela das pastas, atualiza sozinho a cada 5 segundos (pastas novas aparecem)
  setInterval(function () {
    if (document.hidden) return;
    if (!stage.classList.contains('on')) carregarLista();
    atualizarCache(); // vídeos que terminaram de baixar ganham o ícone
  }, 5000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !stage.classList.contains('on')) carregarLista();
  });
})();
</script>
</body>
</html>
